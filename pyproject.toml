[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-code"
version = "0.1.0"
description = "AST-driven regression & adversarial bug fixer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "libcst>=1.1.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "docker>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "pydantic>=2.5.0",
]

[project.scripts]
aegis = "aegis_code.cli:app"

[tool.setuptools.packages.find]
include = ["aegis_code*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
